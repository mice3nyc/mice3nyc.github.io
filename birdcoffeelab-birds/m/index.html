<title>버드커피랩 새</title>
<style>
  :root { --ink: #672C2C; --cream: #F3ECE0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--cream); }
  body { font-family: -apple-system, "Apple SD Gothic Neo", "Pretendard", sans-serif; color: var(--ink);
         -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  #stage { position: fixed; inset: 0; background: var(--cream) center / cover no-repeat; cursor: crosshair; }
  #lidImg { position: absolute; left: 0; top: 0; display: none; pointer-events: none; z-index: 1;
            filter: drop-shadow(0 8px 18px rgba(70, 45, 35, .22)); }
  #logoImg { position: absolute; left: 0; top: 0; display: none; pointer-events: none; z-index: 1; }
  body.bg-lid #lidImg, body.scene-lid #lidImg, body.bg-lid #logoImg, body.scene-lid #logoImg { display: block; }
  body.scene-lid #ui .sky-only { display: none; }
  #cv { position: absolute; left: 0; top: 0; z-index: 2; pointer-events: none; }
  #ui { position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%);
        display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 10px; padding: 8px 10px;
        width: max-content; max-width: calc(100vw - 24px);
        background: rgba(243, 236, 224, .92); border: 1.5px solid var(--ink); border-radius: 999px; font-size: 13px; }
  #ui .grp { display: flex; align-items: center; gap: 4px; }
  #ui .lbl { opacity: .6; margin-right: 2px; }
  #ui button { font: inherit; color: var(--ink); background: none; border: 1.5px solid transparent; border-radius: 999px;
               padding: 3px 9px; cursor: pointer; }
  #ui button.on { border-color: var(--ink); background: var(--ink); color: var(--cream); }
  #ui #count { min-width: 1.6em; text-align: center; font-variant-numeric: tabular-nums; }
  body.hide-ui #ui { display: none; }
  #showUi { display: none; position: fixed; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); z-index: 999;
            width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--ink); background: rgba(243, 236, 224, .7);
            color: var(--ink); font: inherit; font-size: 16px; line-height: 1; opacity: .45; cursor: pointer; }
  body.hide-ui #showUi { display: block; }
  body.no-ui #ui, body.no-ui #showUi { display: none !important; }
  @media (max-width: 620px) { #ui { left: 12px; right: 12px; width: auto; max-width: none; transform: none; border-radius: 18px; } }
</style>

<script>
// 판본별 설정. 기본값 = 데스크톱 판(조작 막대 있음). 모바일 판(/m/)은 build.py가 /*CFG*/ 자리에 덮어쓴다
const CFG = Object.assign({
  ui: true, scene: null, wing: null,
  lidH: 0.5, lidW: 0.9,            // 뚜껑 지름 = min(화면 높이×lidH, 폭×lidW)
  groupY: 0.5,                     // 뚜껑+로고 덩어리의 세로 중심(화면 높이 비율)
  interval: [0.7, 1.4], maxFliers: 12, cool: 4,   // 이륙 간격(초) · 동시에 떠 있는 최대 · 한 자리 쉬는 시간
  speed: [0.9, 1.6], rise: [0.15, 0.7],           // 옆·위 속도(새 크기 배수/초)
}, {"ui": false, "scene": "lid", "wing": "wedge", "lidH": 0.4, "lidW": 0.75, "groupY": 0.64, "interval": [0.35, 0.75], "maxFliers": 20, "cool": 2.5, "speed": [0.15, 0.55], "rise": [0.9, 1.5]});
const stage = document.getElementById('stage');
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
// 경첩: 큰 반원은 평평한 변 y=113, 작은 반원은 45도로 기운 지름의 가운데
const HINGE = {
  b1: { body: 113, wedge: [119.6075, 107.6075] },
  b2: { body: 113, wedge: [116.6075, 107.6075] },
};
let wingMode = 'body';
let W = innerWidth, H = innerHeight, dpr = 1;
const birds = [];

function rand(a, b) { return a + Math.random() * (b - a); }

// ── 그리기: 새 조각을 한 번만 비트맵으로 구워 두고 캔버스에 찍는다 ─────────────
// 점 무늬 새 한 마리는 점 도형 약 700개 + 알파 마스크다. SVG를 DOM에 두고 매 프레임 날개·투명도·그림자 필터를
// 바꾸면 브라우저가 새마다 그 전부를 다시 래스터화한다(폰은 두세 마리에서 버벅였다, 9/27).
// 조각 셋(몸통 큰 반원 · 머리+부리+눈 · 작은 반원)과 각각의 흐린 그림자를 시작할 때 한 번 구워 두면
// 매 프레임 일은 drawImage 몇 번뿐이다.
const DEFS = document.querySelector('svg defs');
const GROUPS = { body: ['body'], rest: ['beak', 'eye', 'head'], wedge: ['wedge'] };
const PAD = 26;                    // 그림자 여백(SVG 단위)
const SPR = {};                    // prefix → { body, rest, wedge: {img, shadow} } | Promise
let SPR_PX = 384;

function partSvg(prefix, names) {
  const masks = [...DEFS.querySelectorAll(`mask[id^="${prefix}_"]`)].map(m => m.outerHTML).join('');
  const body = names.map(n => DEFS.querySelector(`#${prefix}-${n}`)).filter(Boolean).map(g => g.innerHTML).join('');
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="${SPR_PX}" height="${SPR_PX}"><defs>${masks}</defs>${body}</svg>`;
}
async function bake(prefix, names) {
  const img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(partSvg(prefix, names));
  await img.decode();
  const k = SPR_PX / 180;
  const a = document.createElement('canvas');
  a.width = a.height = SPR_PX;
  a.getContext('2d').drawImage(img, 0, 0, SPR_PX, SPR_PX);
  // 흐린 그림자: 도형은 화면 밖에 그리고 shadowOffset으로 그림자만 제자리에 떨어뜨린다(ctx.filter는 사파리에 없다)
  const sh = document.createElement('canvas');
  sh.width = sh.height = Math.ceil((180 + 2 * PAD) * k);
  const c = sh.getContext('2d');
  c.shadowColor = 'rgb(40,20,20)';
  c.shadowBlur = 7 * k;
  c.shadowOffsetX = 20000;
  c.drawImage(a, PAD * k - 20000, PAD * k);
  return { img: a, shadow: sh };
}
function sprites(prefix) {
  if (!SPR[prefix]) {
    SPR[prefix] = Promise.all(Object.entries(GROUPS).map(([g, n]) => bake(prefix, n).then(r => [g, r])))
      .then(list => { SPR[prefix] = Object.fromEntries(list); return SPR[prefix]; });
  }
  return SPR[prefix];
}

function resizeCanvas() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
}

function flipBody(kind, s) { const y = HINGE[kind].body; ctx.translate(0, y); ctx.scale(1, s); ctx.translate(0, -y); }
function flipWedge(kind, s) {
  const [cx, cy] = HINGE[kind].wedge;
  ctx.translate(cx, cy); ctx.rotate(Math.PI * .75); ctx.scale(1, s); ctx.rotate(-Math.PI * .75); ctx.translate(-cx, -cy);
}
// o: { prefix, kind, x, y(왼쪽 위 px), size, ox, oy(회전 중심, 비율), rot(도), sx, sy, alpha, sBody, sWedge, shadow{dx,dy,al}? }
function drawBird(o) {
  const sp = SPR[o.prefix];
  if (!sp || sp instanceof Promise || o.alpha <= 0) return;
  const k = o.size / 180;
  const base = (dx, dy) => {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.translate(o.x + o.ox * o.size + dx, o.y + o.oy * o.size + dy);
    ctx.rotate(o.rot * Math.PI / 180);
    ctx.scale(o.sx, o.sy);
    ctx.translate(-o.ox * o.size, -o.oy * o.size);
    ctx.scale(k, k);
  };
  const parts = shadow => {
    const put = (g, pose) => {
      ctx.save();
      if (pose) pose();
      if (shadow) ctx.drawImage(sp[g].shadow, -PAD, -PAD, 180 + 2 * PAD, 180 + 2 * PAD);
      else ctx.drawImage(sp[g].img, 0, 0, 180, 180);
      ctx.restore();
    };
    put('body', o.sBody !== 1 && (() => flipBody(o.kind, o.sBody)));
    put('rest');
    put('wedge', o.sWedge !== 1 && (() => flipWedge(o.kind, o.sWedge)));
  };
  if (o.shadow && o.shadow.al > 0) { ctx.globalAlpha = o.alpha * o.shadow.al; base(o.shadow.dx, o.shadow.dy); parts(true); }
  ctx.globalAlpha = o.alpha; base(0, 0); parts(false);
}

function wingPose(b, s, s2) {
  const flapBody = wingMode === 'body' || wingMode === 'both';
  const flapWedge = wingMode === 'wedge' || wingMode === 'both';
  b.sBody = flapBody ? s : 1;
  b.sWedge = flapWedge ? (wingMode === 'both' ? s2 : s) : 1;
}

// ── 장면 1: 하늘 ────────────────────────────────────────
function makeBird(opts = {}) {
  const kind = opts.kind || (Math.random() < .5 ? 'b1' : 'b2');
  const size = opts.size || rand(64, 170);
  const z = (size - 64) / 106;                        // 0=멀리 1=가까이
  sprites(kind);
  const b = {
    kind, prefix: kind, size, z, ox: .5, oy: .5, sx: 1, sy: 1, alpha: 1, sBody: 1, sWedge: 1, rot: 0,
    x: opts.x ?? W + rand(0, W * .6), y: 0,
    y0: opts.y ?? rand(H * .05, H * .8),
    vx: -(38 + 95 * z) * rand(.85, 1.15),
    freq: (3.4 - 1.6 * z) * rand(.9, 1.1),          // 날갯짓 Hz
    phase: rand(0, Math.PI * 2),
    driftA: rand(10, 40), driftF: rand(.08, .25), driftP: rand(0, 6.3),
    glide: 0, glideT: rand(2, 7), sink: 0, t: 0, vy: 0, lastY: null,
  };
  if (opts.x != null) { b.x -= size * .45; b.y0 -= size * .45; }
  birds.push(b);
  birds.sort((p, q) => p.size - q.size);              // 작은(먼) 새부터 그린다
  return b;
}

function step(b, dt) {
  b.t += dt;
  // 활공: 몇 초에 한 번 날갯짓을 멈추고 원본 자세로 미끄러진다
  b.glideT -= dt;
  if (b.glideT <= 0) {
    if (b.glide > 0) { b.glide = 0; b.glideT = rand(3, 8); }
    else { b.glide = rand(.6, 1.6); b.glideT = b.glide; }
  }
  const gliding = b.glide > 0;
  const beat = gliding ? 0 : 1;
  if (!gliding) b.phase += Math.PI * 2 * b.freq * dt;
  else b.phase = lerpAngleToZero(b.phase, dt * 6);   // 날개를 내린 자세(cos=1)로
  b.sink += (gliding ? 14 : -10) * dt;
  b.sink = Math.max(-20, Math.min(40, b.sink));

  const c = Math.cos(b.phase);
  const s = 0.325 + 0.675 * c;                         // 1(원본 자세) ↔ -0.35(위로 접힘)
  const s2 = 0.325 + 0.675 * Math.cos(b.phase - 0.9);
  const bob = -Math.sin(b.phase) * b.size * .07 * beat;

  b.x += b.vx * dt;
  const y = b.y0 + Math.sin(b.t * b.driftF * 6.283 + b.driftP) * b.driftA + bob + b.sink;
  const vy = b.lastY == null ? 0 : (y - b.lastY) / Math.max(dt, 1e-3);
  b.lastY = y;
  b.vy += (vy - b.vy) * Math.min(1, dt * 4);
  b.rot = Math.max(-12, Math.min(12, b.vy * 0.12));
  b.y = y;
  wingPose(b, s, s2);

  if (b.x < -b.size * 1.2) {
    b.x = W + rand(20, W * .4);
    b.y0 = rand(H * .05, H * .8);
    b.sink = 0;
  }
}

function lerpAngleToZero(p, k) {
  const a = Math.atan2(Math.sin(p), Math.cos(p));
  return a - a * Math.min(1, k);
}

const Q = new URLSearchParams(location.search);
const POSE = Q.get('pose');
let scene = 'sky';

// ── 장면 2: 뚜껑에서 이륙 ───────────────────────────────
// lid.json(lid_detect.py): 사진 속 인쇄된 새의 머리 중심(사진 px) · 격자 기울기 · 머리 반지름
const LID = {"image": [1329, 1329], "lid": {"x": 664.0, "y": 664.0, "r": 664.0, "print_r": 616.0}, "lattice": {"O": [756.58, 388.82], "a": [403.36, -5.852], "b": [6.364, 404.083]}, "angle_deg": -0.831, "head_r": 142.25, "sticker": [581, 671, 1250, 960], "ink": "#63111D", "paper": "#E2E9ED", "birds": [{"x": 154.7, "y": 599.6, "kind": "b2"}, {"x": 161.1, "y": 1003.7, "kind": "b2"}, {"x": 353.2, "y": 394.7, "kind": "b1"}, {"x": 359.6, "y": 798.8, "kind": "b1"}, {"x": 366.0, "y": 1202.8, "kind": "b1"}, {"x": 551.7, "y": 189.7, "kind": "b2"}, {"x": 558.1, "y": 593.8, "kind": "b2"}, {"x": 756.6, "y": 388.8, "kind": "b1"}, {"x": 769.3, "y": 1197.0, "kind": "b1"}, {"x": 955.1, "y": 183.9, "kind": "b2"}, {"x": 961.4, "y": 587.9, "kind": "b2"}, {"x": 1159.9, "y": 383.0, "kind": "b1"}]};
const U = LID.head_r / 45;                 // 사진 px / SVG 단위 (SVG 머리 반지름 45)
const HEAD = { b1: [76, 68], b2: [78, 68] };  // SVG 안 머리 중심
const homes = LID.birds.map(h => ({ ...h, cool: 0 }));
const fliers = [];
let nextLaunch = 0.6;

// 뚜껑 지름 = min(화면 높이×lidH, 폭×lidW). 그 아래 로고(폭 = 지름의 40%).
// 뚜껑+간격+로고를 한 덩어리로 보고 그 중심을 화면 높이의 groupY 지점에 둔다(아래 여백은 남긴다)
const LOGO = [674, 304];
function lidLayout() {
  const D = Math.min(H * CFG.lidH, W * CFG.lidW);
  const lw = D * 0.4, lh = lw * LOGO[1] / LOGO[0], gap = D * 0.09;
  const groupH = D + gap + lh;
  let top = H * CFG.groupY - groupH / 2;
  top = Math.min(top, H - Math.max(16, H * 0.05) - groupH);
  const cy = top + D / 2;
  return { D, cy, logo: { w: lw, x: W / 2 - lw / 2, y: cy + D / 2 + gap } };
}
function lidMap() {
  const { D, cy } = lidLayout();
  const sc = D / (2 * LID.lid.r);
  return { sc, ox: W / 2 - LID.lid.x * sc, oy: cy - LID.lid.y * sc };
}
const lidImg = document.getElementById('lidImg');
const logoImg = document.getElementById('logoImg');
function placeLid() {
  const { sc, ox, oy } = lidMap();
  lidImg.style.width = LID.image[0] * sc + 'px';
  lidImg.style.transform = `translate(${ox}px, ${oy}px)`;
  const { logo } = lidLayout();
  logoImg.style.width = logo.w + 'px';
  logoImg.style.transform = `translate(${logo.x}px, ${logo.y}px)`;
}

// 인쇄된 머리와 겹치는 자리(SVG 왼쪽 위, 화면 px). 화면 크기가 바뀌어도 따라가도록 매번 계산한다
function homeXY(home) {
  const { sc, ox, oy } = lidMap();
  const size = 180 * U * sc;
  const [hx, hy] = HEAD[home.kind];
  return { size, x: ox + home.x * sc - hx / 180 * size, y: oy + home.y * sc - hy / 180 * size };
}

function launch(home, t0 = 0) {
  const { size, x, y } = homeXY(home);
  const [hx, hy] = HEAD[home.kind];
  home.cool = CFG.cool;
  const f = {
    kind: home.kind, prefix: home.kind + 'l', home, size, t: t0, x, y,
    ox: hx / 180, oy: hy / 180, sx: 1, sy: 1, rot: 0, alpha: 0, sBody: 1, sWedge: 1, shadow: { dx: 0, dy: 0, al: 0 },
    // 절반은 떠오르자마자 몸을 뒤집어(h-flip) 오른쪽으로 난다
    dir: Math.random() < .5 ? -1 : 1,
    speed: size * rand(...CFG.speed), vy: -size * rand(...CFG.rise),
    shrink: rand(.16, .26), phase: 0, freq: rand(2.6, 3.4), bobA: size * .05, bob: 0,
  };
  fliers.push(f);
  return f;
}

const APPEAR = 0.5;   // 제자리에서 나타나는 시간(날개는 원본 자세)
const RAMP = 0.5;     // 날갯짓·속도가 붙는 시간
function lidStep(dt) {
  for (const h of homes) h.cool -= dt;
  nextLaunch -= dt;
  if (nextLaunch <= 0 && fliers.length < CFG.maxFliers) {
    const free = homes.filter(h => h.cool <= 0);
    if (free.length) launch(free[Math.floor(Math.random() * free.length)]);
    nextLaunch = rand(...CFG.interval);
  }
  for (let i = fliers.length - 1; i >= 0; i--) {
    const f = fliers[i];
    f.t += dt;
    const a = Math.min(1, f.t / APPEAR);
    const e = a * a * (3 - 2 * a);
    const tf = Math.max(0, f.t - APPEAR);
    const r = Math.min(1, tf / RAMP);
    const lift = Math.min(1, f.t / 1.4);                 // 뚜껑에서 떨어진 높이 0..1
    // 멀어지며 작아진다(최소 0.35배). 속도도 같은 비율로 줄여 원근을 맞춘다
    const scale = Math.max(.35, 1 + .06 * e - f.shrink * tf);
    // 오른쪽으로 갈 새는 날아오르며 0.4초 동안 돈다: 가로 배율 1 → 0(옆모습) → -1
    const turn = f.dir > 0 ? Math.min(1, tf / .4) : 0;
    const sx = Math.cos(Math.PI * turn);
    if (tf === 0) {                                      // 아직 제자리: 인쇄 위치에 붙어 있는다
      const p = homeXY(f.home);
      f.size = p.size; f.x = p.x; f.y = p.y;
    } else {
      f.phase += Math.PI * 2 * f.freq * dt * r;
      const go = f.dir > 0 ? Math.max(0, sx < 0 ? -sx : 0) : 1;   // 도는 동안은 옆으로 거의 안 간다
      f.x += f.dir * f.speed * go * r * scale * dt;
      f.y += f.vy * r * scale * dt;
    }
    const s = 1 - r * (1 - (0.325 + 0.675 * Math.cos(f.phase)));
    const s2 = 1 - r * (1 - (0.325 + 0.675 * Math.cos(f.phase - 0.9)));
    wingPose(f, s, s2);
    // 오르는 만큼 부리를 든다(왼쪽으로 나는 새는 시계 방향, 오른쪽은 반시계)
    const climb = Math.min(1, Math.max(0, -f.vy / f.size));
    const nose = sx < 0 ? -1 : 1;
    f.rot = LID.angle_deg + nose * 8 * r * climb;
    f.alpha = e;
    f.sx = scale * sx; f.sy = scale;
    f.bob = -Math.sin(f.phase) * f.bobA * r;
    const d = (2 + 26 * lift) * scale;
    // 그림자는 뚜껑에서 떨어져 나오는 신호로만 쓴다: 나타날 때 생기고, 날아오르면 0.9초 안에 사라진다(하늘엔 떨어질 바닥이 없다)
    const fade = 1 - Math.min(1, tf / 0.9);
    f.shadow.dx = d * .35; f.shadow.dy = d; f.shadow.al = (.38 - .18 * lift) * fade;
    const sz = f.size * scale, hxS = f.x + f.ox * f.size, hyS = f.y + f.oy * f.size;
    if (hxS + sz < -20 || hxS - sz > W + 20 || hyS + sz < -20) fliers.splice(i, 1);
  }
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (scene === 'sky') for (const b of birds) drawBird(b);
  else for (const f of fliers) drawBird({ ...f, y: f.y + f.bob });
  ctx.globalAlpha = 1;
}

function setScene(sc) {
  scene = sc;
  document.body.classList.toggle('scene-lid', sc === 'lid');
  document.querySelectorAll('[data-scene]').forEach(x => x.classList.toggle('on', x.dataset.scene === sc));
  if (sc === 'sky') { fliers.length = 0; if (!birds.length) setCount(12); }
  else { nextLaunch = 0.3; sprites('b1l'); sprites('b2l'); }
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (scene === 'sky') for (const b of birds) step(b, dt);
  else lidStep(POSE != null ? 0 : dt);
  render();
  if (POSE == null) requestAnimationFrame(frame);
}

function setCount(n) {
  n = Math.max(1, Math.min(60, n));
  while (birds.length < n) makeBird({});
  while (birds.length > n) birds.splice(Math.floor(Math.random() * birds.length), 1);
  document.getElementById('count').textContent = birds.length;
}

stage.addEventListener('pointerdown', e => {
  if (scene === 'lid') {
    // 뚜껑 위를 탭하면 가장 가까운 인쇄 새가 바로 오른다
    const { sc, ox, oy } = lidMap();
    const px = (e.clientX - ox) / sc, py = (e.clientY - oy) / sc;
    if (Math.hypot(px - LID.lid.x, py - LID.lid.y) > LID.lid.r) return;
    const cand = homes.filter(h => h.cool < CFG.cool - 0.6)
      .sort((p, q) => Math.hypot(p.x - px, p.y - py) - Math.hypot(q.x - px, q.y - py))[0];
    if (cand) launch(cand);
    return;
  }
  makeBird({ x: e.clientX, y: e.clientY, size: rand(90, 160) });
  document.getElementById('count').textContent = birds.length;
});
document.querySelectorAll('[data-scene]').forEach(btn => btn.onclick = () => setScene(btn.dataset.scene));
document.querySelectorAll('[data-wing]').forEach(btn => btn.onclick = () => {
  wingMode = btn.dataset.wing;
  document.querySelectorAll('[data-wing]').forEach(x => x.classList.toggle('on', x === btn));
});
document.querySelectorAll('[data-bg]').forEach(btn => btn.onclick = () => {
  document.body.classList.toggle('bg-lid', btn.dataset.bg === 'lid');
  document.querySelectorAll('[data-bg]').forEach(x => x.classList.toggle('on', x === btn));
});
document.getElementById('more').onclick = () => setCount(birds.length + 4);
document.getElementById('less').onclick = () => setCount(birds.length - 4);
document.getElementById('hide').onclick = () => document.body.classList.add('hide-ui');
document.getElementById('showUi').onclick = () => document.body.classList.remove('hide-ui');
addEventListener('keydown', e => { if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('hide-ui'); });
addEventListener('resize', () => { W = innerWidth; H = innerHeight; resizeCanvas(); placeLid(); });
resizeCanvas();
placeLid();

// 시작 장면: 로컬은 하늘, 배포본은 뚜껑(build.py가 바꿔 넣는다). #lid·#sky 해시도 받는다
const DEFAULT_SCENE = /*SCENE*/'sky';
const want = Q.get('scene') || location.hash.slice(1) || CFG.scene || DEFAULT_SCENE;
if (!CFG.ui) document.body.classList.add('no-ui');
if (Q.get('wing') || CFG.wing) {
  wingMode = Q.get('wing') || CFG.wing;
  document.querySelectorAll('[data-wing]').forEach(x => x.classList.toggle('on', x.dataset.wing === wingMode));
}
// 비트맵 해상도: 가장 크게 그려질 새(하늘 170px · 뚜껑 새 ×1.1) × 화면 배율. 폰 레티나에서도 뭉개지지 않게
SPR_PX = Math.min(640, Math.max(256, Math.ceil(Math.max(170, homeXY(homes[0]).size * 1.1) * dpr)));
if (want === 'lid') setScene('lid');
else {
  // 처음 화면: 화면 안에 이미 날고 있는 새들로 시작
  for (let i = 0; i < 12; i++) { const b = makeBird({}); b.x = rand(-40, W); }
  document.getElementById('count').textContent = birds.length;
}
const firstScene = scene;
requestAnimationFrame(frame);

// 확인용(뚜껑): ?scene=lid&pose=초 이면 후보 전부를 그 시각까지 날린 한 장면을 그린다
if (POSE != null && firstScene === 'lid') {
  nextLaunch = 1e9;
  setTimeout(() => {           // 헤드리스는 창 높이가 늦게 확정된다 — 확정된 뒤에 세운다
    W = innerWidth; H = innerHeight; resizeCanvas(); placeLid();
    homes.forEach(h => { const f = launch(h); f.speed = 0; f.vy = 0; f.shrink = 0; const t = parseFloat(POSE);
      f.t = Math.min(t, APPEAR); lidStep(0);
      f.t = Math.min(t, APPEAR + RAMP); f.phase = Math.PI * 2 * f.freq * Math.max(0, t - APPEAR); lidStep(0); });
    Promise.all([sprites('b1l'), sprites('b2l')]).then(render);
  }, 300);
}
// 확인용(하늘): ?pose=0..1 이면 모든 새를 그 위상에 멈춘다
if (POSE != null && firstScene === 'sky') {
  const p = parseFloat(POSE) * Math.PI * 2;
  birds.forEach((b, i) => { b.freq = 0; b.phase = p; b.glideT = 1e9; b.vx = 0; b.driftA = 0; b.sink = 0;
    b.x = 40 + (i % 4) * (W / 4); b.y0 = 40 + Math.floor(i / 4) * (H / 3); step(b, 0); });
  Promise.all([sprites('b1'), sprites('b2')]).then(render);
}
</script>
</body>
</html>
